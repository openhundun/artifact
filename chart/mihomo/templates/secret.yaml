{{- $fullname := .Values.fullnameOverride | default .Release.Name }}
{{- if and .Values.config.content .Values.config.existingSecret }}
{{- fail "[mihomo][config]: FAIL" }}
{{- end }}
{{- if and (not .Values.config.content) (not .Values.config.existingSecret) }}
{{- fail "[mihomo][config]: FAIL" }}
{{- end }}
{{- if .Values.config.content }}
{{- $cfg := fromYaml .Values.config.content }}
{{- range $key := list "mixed-port" "allow-lan" "bind-address" }}
{{- if hasKey $cfg $key }}
{{- fail "[mihomo][config]: FAIL" }}
{{- end }}
{{- end }}
{{- if not (hasKey $cfg "external-controller") }}
{{- fail "[mihomo][config]: FAIL" }}
{{- end }}
{{- $portStr := regexFind ":[0-9]+$" (index $cfg "external-controller") | trimPrefix ":" }}
{{- if not $portStr }}
{{- fail "[mihomo][config]: FAIL" }}
{{- end }}
{{- $port := int $portStr }}
{{- if le $port 0 }}
{{- fail "[mihomo][config]: FAIL" }}
{{- end }}
{{- if ne $port (int .Values.service.ports.api.port) }}
{{- fail "[mihomo][config]: FAIL" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mihomo
    app.kubernetes.io/instance: {{ $fullname }}
type: Opaque
stringData:
  config.yaml: |-
    mixed-port: {{ .Values.service.ports.mixed.port }}
    allow-lan: true
    bind-address: "*"
    {{- .Values.config.content | nindent 4 }}
{{- end }}
