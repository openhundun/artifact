defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  rndis_host:
    if: ${{ inputs.rndis_host }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash deb/sh.sh job__rndis_host step__build
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deb/sh.sh job__rndis_host step__release
    timeout-minutes: 10
  rtl8852bu:
    if: ${{ inputs.rtl8852bu }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash deb/sh.sh job__rtl8852bu step__build
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deb/sh.sh job__rtl8852bu step__release
    timeout-minutes: 10
name: deb
on:
  workflow_dispatch:
    inputs:
      rndis_host: { default: false, type: boolean }
      rtl8852bu: { default: false, type: boolean }
permissions:
  contents: write
