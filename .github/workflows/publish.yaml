name: publish

on:
  workflow_dispatch:
    inputs:
      image:
        description: 镜像选择器。dockerfile 家族填家族名（如 ubuntu-llvm-zig）；nix 家族填 name:tag（如 nix-python:2.35-3.13）；all 表示全部
        required: true
        default: all
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, build]
    timeout-minutes: 720

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Prepare an isolated docker config that reuses the shared builder
        run: |
          sudo -n rm -rf /tmp/ci-docker
          sudo -n mkdir -p /tmp/ci-docker
          sudo -n cp -a /root/.docker/buildx /tmp/ci-docker/

      - name: Log in to the Container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo -n env DOCKER_CONFIG=/tmp/ci-docker docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish images
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "selector = ${IMAGE}"
          echo "registry = ${IMAGE_REGISTRY}"
          echo "actor    = ${{ github.actor }}"
          echo

          if [ "${IMAGE}" = "all" ]; then
            echo "== dockerfile 家族 =="
            sudo -n env DOCKER_CONFIG=/tmp/ci-docker IMAGE_REGISTRY="${IMAGE_REGISTRY}" bash image/sh.sh publish all
            echo
            echo "== nix 家族 =="
            sudo -n env DOCKER_CONFIG=/tmp/ci-docker IMAGE_REGISTRY="${IMAGE_REGISTRY}" bash image/nix/sh.sh publish all
          elif [ -d "image/${IMAGE}" ]; then
            sudo -n env DOCKER_CONFIG=/tmp/ci-docker IMAGE_REGISTRY="${IMAGE_REGISTRY}" bash image/sh.sh publish "${IMAGE}"
          else
            sudo -n env DOCKER_CONFIG=/tmp/ci-docker IMAGE_REGISTRY="${IMAGE_REGISTRY}" bash image/nix/sh.sh publish "${IMAGE}"
          fi
