name: publish

on:
  workflow_dispatch:
    inputs:
      group:
        description: 发布分组。dockerfile 家族按家族名前缀分组，nix 为独立家族
        required: true
        default: all
        type: choice
        options:
          - all
          - alpine
          - debian
          - ubuntu
          - nix

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, build]
    timeout-minutes: 720

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Prepare an isolated docker config that reuses the shared builder
        run: |
          sudo -n rm -rf /tmp/ci-docker
          sudo -n mkdir -p /tmp/ci-docker
          sudo -n cp -a /root/.docker/buildx /tmp/ci-docker/

      - name: Log in to the Container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo -n env DOCKER_CONFIG=/tmp/ci-docker docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish
        env:
          GROUP: ${{ inputs.group }}
          ACTOR: ${{ github.actor }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          publish() {
              sudo -n env DOCKER_CONFIG=/tmp/ci-docker IMAGE_REGISTRY="${IMAGE_REGISTRY}" bash "$@"
          }
          echo "group    = ${GROUP}"
          echo "registry = ${IMAGE_REGISTRY}"
          echo "actor    = ${ACTOR}"
          echo
          case "${GROUP}" in
          all)
              publish image/sh.sh publish all
              publish image/nix/sh.sh publish all
              ;;
          nix)
              publish image/nix/sh.sh publish all
              ;;
          *)
              publish image/sh.sh publish "${GROUP}"
              ;;
          esac
