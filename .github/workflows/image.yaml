defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  alpine:
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/../docker-config-alpine
    if: ${{ inputs.alpine }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - run: bash image/sh.sh job__alpine step__build
    timeout-minutes: 60
  debian:
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/../docker-config-debian
    if: ${{ inputs.debian }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - run: bash image/sh.sh job__debian step__build
    timeout-minutes: 60
  nix:
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/../docker-config-nix
    if: ${{ inputs.nix }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - run: bash image/sh.sh job__nix step__build
    timeout-minutes: 60
  ubuntu:
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/../docker-config-ubuntu
    if: ${{ inputs.ubuntu }}
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - run: bash image/sh.sh job__ubuntu step__build
    timeout-minutes: 60
name: image
on:
  workflow_dispatch:
    inputs:
      alpine: { default: false, type: boolean }
      debian: { default: false, type: boolean }
      nix: { default: false, type: boolean }
      ubuntu: { default: false, type: boolean }
permissions:
  contents: read
  packages: write
